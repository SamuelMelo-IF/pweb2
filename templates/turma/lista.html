{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Lista Turmas</h1>

<div class="row">

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Semestre</th>
                <th>Curso</th>
                <th>Professor</th>
                <th>Ação</th>
        </thead>

        <tbody>

            {% for item in lista %}

            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[3] }}</td>
                <td>
                    <a href="/turma/editar/{{ item[0] }}"
                       class="btn btn-primary btn-sm">
                        Editar
                    </a>

                    <a href="/turma/remover/{{ item[0] }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Tem certeza que deseja remover este registro?');">
                        Remover
                    </a>
                </td>
            </tr>

            {% else %}

            <tr>
                <td colspan="5" class="text-center">
                    Nenhuma turma cadastrado.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>
